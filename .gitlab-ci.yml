default:
  tags:
    - builder

  cache:
    - key:
        files:
          - uv.lock
      paths:
        - /root/.cache/.uv

  image: ghcr.io/astral-sh/uv:0.9.10-python3.9-alpine@sha256:ea9b07aa69d7a86e09ac34563ad6f291955f6a7fcfa3d740f89c6ce44cec60b9

  before_script:
    - python --version ; pip --version ; uv --version
    - uv sync --frozen --no-cache

  after_script:
    - uv cache prune --ci

check:
  script:
    - uv run ruff check
    - uv run ruff format --check


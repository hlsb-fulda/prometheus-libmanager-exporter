[project]
name = "prometheus-libmanager-exporter"
version = "0.1.0"
authors = [ { name = "Dustin Frisch", email = "fooker@lab.sh" } ]

requires-python = ">=3.13"
dependencies = [
    "click >= 8.3.1",
    "prometheus-client >= 0.23.1",
    "requests >= 2.32.5",
    "beautifulsoup4 >= 4.14.2",
    "structlog >= 25.5.0",
]

[project.scripts]
prometheus-libmanager-exporter = "prometheus_libmanager_exporter:."

[build-system]
requires = ["hatchling >= 1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 140


name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    
    container:
      image: ghcr.io/astral-sh/uv:0.11.27-python3.9-alpine@sha256:fdd60121f20263bdd40e33860d8f4fa1e973d6d707ce227a8e46d0d6dc60d0b7
    
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      
      - name: Cache uv
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /root/.cache/.uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Show versions
        run: |
          python --version
          pip --version
          uv --version
      
      - name: Install dependencies
        run: uv sync --frozen --no-cache
      
      - name: Run ruff check
        run: uv run ruff check
      
      - name: Run ruff format check
        run: uv run ruff format --check
      
      - name: Cleanup cache
        if: always()
        run: uv cache prune --ci


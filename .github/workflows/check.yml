name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    
    container:
      image: ghcr.io/astral-sh/uv:0.12.10-python3.9-alpine@sha256:708fa9ec0af9d19d136637c45549146b462463d6430f21604a8bfa80863fead3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Cache uv
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /root/.cache/.uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Show versions
        run: |
          python --version
          pip --version
          uv --version
      
      - name: Install dependencies
        run: uv sync --frozen --no-cache
      
      - name: Run ruff check
        run: uv run ruff check
      
      - name: Run ruff format check
        run: uv run ruff format --check
      
      - name: Cleanup cache
        if: always()
        run: uv cache prune --ci

